name = "gasko-api"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "STATIONS_CACHE"
id = "REPLACE_WITH_KV_ID"

[[d1_databases]]
binding = "DB"
database_name = "gasko-db"
database_id = "REPLACE_WITH_D1_ID"

[vars]
ENV = "production"